plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}
group = 'com.hexgodofstories'
version = '0.6.2-scepter'
base { archivesName = 'hexgodofstories' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { hexgodofstories { source sourceSets.main } }
        }
        client {}
        server {
            args '--nogui'
            // The integration listener is test-only and is never included in the release JAR.
            if (project.hasProperty('warpingSmoke')) {
                mods { hexgodofstories { source sourceSets.test } }
            }
        }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'hexgodofstories' }
    }
}
repositories {
    maven { url = "https://maven.firstdarkdev.xyz/snapshots"; content { includeGroup "com.lowdragmc.photon"; includeGroup "com.lowdragmc.ldlib" } }
    maven { url = 'https://cursemaven.com/'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup 'software.bernie.geckolib' } }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation(fg.deobf('com.lowdragmc.photon:photon-forge-1.20.1:1.1.17@jar')) { transitive = false }
    implementation(fg.deobf('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.42@jar')) { transitive = false }
    implementation(fg.deobf('curse.maven:playeranimator-658587:4587214')) { transitive = false }
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin { add sourceSets.main, 'hexgodofstories.refmap.json'; config 'hexgodofstories.mixins.json' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest { attributes('MixinConfigs': 'hexgodofstories.mixins.json') }
    finalizedBy 'reobfJar'
}

// Geometry regression checks run on every compile action without launching a Minecraft client.
tasks.register('verifyRealmShape', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.server.RealmShapeTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyRealmShape' }

// Tap/hold boundaries and progressive fragment lifetime invariants; no Minecraft window required.
tasks.register('verifyTimeBranch', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.data.TimeBranchRegressionTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyTimeBranch' }

// Borrowed Reality's size table and facing; no block palette and no Minecraft bootstrap required.
tasks.register('verifyIllusoryWall', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.data.IllusoryWallTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyIllusoryWall' }

// The pool's outline, how it spreads, where a body may stand in it, and the cost curve.
tasks.register('verifyWarping', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.warping.WarpMathTest'
}
tasks.named('check') { dependsOn 'verifyWarping' }

// The Abyssal Pilgrim's geometry, animation, audio and realm constants must stay in step with the
// code that poses and places it. No Minecraft bootstrap required.
tasks.register('verifyVoidSea', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.warping.VoidSeaShapeTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyVoidSea' }

// The Void Sea's swell: that it never opens a hole in the water, runs one way, leaves the deep
// calm, and stays cheap to resolve. No Minecraft world required; the ocean is a formula.
tasks.register('verifyVoidSeaWaves', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.warping.VoidSeaWaveTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyVoidSeaWaves' }

// Exercise real movement history, late-tracking checkpoints, and 3D render orientation.
tasks.register('verifyPilgrimMotion', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.warping.PilgrimMotionTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyPilgrimMotion' }

// How hard Hexor hits what it bites, and what a crowded ocean does to the hunt. Pure arithmetic
// plus a read of the creature's own source, so no Minecraft world is needed for either.
tasks.register('verifyHexor', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.warping.HexorTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyHexor' }

// Paradise: that its islands can be jumped between at its own gravity, that its cascades land
// where they were aimed, that the spring has a shore, and that the realm stays a pocket.
tasks.register('verifyParadise', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.warping.ParadiseShapeTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyParadise' }

// Converging singularity orbits and a continuous moon surface, without launching Minecraft.
tasks.register('verifyCosmicPhysics', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.warping.CosmicPhysicsTest'
}
tasks.named('check') { dependsOn 'verifyCosmicPhysics' }

// Preserve every covered floor pixel when clipping the liquid at terrain/collision boundaries.
tasks.register('verifyWarpTessellation', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.warping.WarpTessellationTest'
}
tasks.named('check') { dependsOn 'verifyWarpTessellation' }

// Effects must be timed the same on a server world that has run for months as on a new one: the
// game-time clock may never be summed with a partial tick, or feed a palette, as a float.
tasks.register('verifyRenderClock', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hexgodofstories.client.RenderClockTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn 'verifyRenderClock' }

// Ship the unmodified Photon runtime beside the mod, so the Actions download is installable.
configurations { photonRuntime }
dependencies {
    photonRuntime('com.lowdragmc.photon:photon-forge-1.20.1:1.1.17@jar') { transitive = false }
}
tasks.register('copyPhotonRuntime', Copy) {
    from configurations.photonRuntime
    into layout.buildDirectory.dir('runtime-mods')
}
tasks.named('build') { dependsOn 'copyPhotonRuntime' }
