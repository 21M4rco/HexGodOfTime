name: Release HexGodOfStories

# Pushing a version tag (v0.7.0), or running it by hand with one, builds the mod and publishes it as a GitHub release, with
# release-notes/<tag>.md as its description. The tag must match the version in build.gradle.
on:
  push:
    tags: ['v*']
  # Or run it by hand on a branch: the tag is created at the commit it ran on.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, such as v1.0.7
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate screen-accurate Scepter assets
        run: python3 scripts/generate_scepter.py
      - name: Build
        run: gradle --no-daemon build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
          version="${TAG#v}"
          notes="release-notes/${TAG}.md"
          jar="build/libs/hexgodofstories-${version}.jar"
          sources="build/libs/hexgodofstories-${version}-sources.jar"
          test -f "$notes" || { echo "Missing $notes"; exit 1; }
          test -f "$jar" || { echo "The build made no $jar: the tag and the version in build.gradle disagree"; ls build/libs; exit 1; }
          gh release create "$TAG" "$jar" "$sources" --target "$GITHUB_SHA" --title "HexGodOfStories ${version}" --notes-file "$notes"
