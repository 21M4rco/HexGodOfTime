name: Build HexGodOfStories
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle --no-daemon build
      - name: Verify client dependency and renderer startup
        run: python3 tools/frost_client_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: hexgodofstories-forge-1.20.1
          path: |
            build/libs/*.jar
            build/runtime-mods/*.jar
          if-no-files-found: error
