name: Warping dedicated server smoke
on:
  push:
    branches: [codex/warping, claude/eager-cerf-ujhdbd]
  workflow_dispatch:
concurrency:
  group: warping-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  warping-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle --no-daemon build
      - run: python3 tools/warping_server_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warping-smoke-log
          path: warping-server-smoke.log
          if-no-files-found: ignore
