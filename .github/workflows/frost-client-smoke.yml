name: Frost renderer client smoke
on:
  push:
    branches: [codex/paradise-time-rework]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle --no-daemon build
      - run: python3 tools/frost_client_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frost-client-smoke-log
          path: frost-client-smoke.log
          if-no-files-found: ignore
